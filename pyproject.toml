# OmniSource is a data repository, not a distributable Python package.
# This file exists solely to configure the linter/formatter used by
# .github/workflows/validate.yml so local runs and CI agree.

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # import order
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "PTH",  # prefer pathlib
  "S",    # bandit security rules
]
ignore = [
  "S310",  # URL schemes are validated before every urlopen call.
  "S603",  # no subprocess use in this repository.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
