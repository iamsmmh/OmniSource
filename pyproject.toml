[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisource"
version = "3.0.0"
description = "Provider-agnostic application catalog, release tracker, feeds, and read-only API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnisource = "omnisource.cli:main"
omnisource-api = "omnisource.api_server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "S",
]
ignore = [
  "S310",  # URLs are validated before network calls.
  "S603",  # Optional package inspection never executes archive contents.
  "S404",  # The health reporter uses the installed gh CLI explicitly.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
