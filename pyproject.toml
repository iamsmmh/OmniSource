[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisource"
version = "3.2.0"
description = "Automatically maintained AltStore-compatible iOS app source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnisource = "omnisource.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "S",
]
ignore = [
  "S310",  # URLs are validated before network calls.
  "S603",  # The health reporter invokes the installed gh CLI explicitly.
  "S404",  # The health reporter uses the installed gh CLI explicitly.
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/*/*.py" = ["E402"]
# The audit generator embeds long markdown/table lines; wrapping them hurts readability.
"scripts/audit.py" = ["E501"]
"tests/*.py" = ["E402", "S101", "S105", "S106"]


[tool.ruff.format]
quote-style = "double"
