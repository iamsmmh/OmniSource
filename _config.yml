# ============================================================================
# GitHub Pages managed build (Jekyll) configuration.
#
# GitHub's server-managed "pages build and deployment" workflow builds THIS
# repository root on every push to the Pages source branch. The canonical
# publisher is sync.yml (which assembles _site/ in CI, including the /api/
# mirror and .gz twins); this file makes the Jekyll build a *correct copy of
# the site* as well, so both publishers deploy equivalent content and can
# never break the site (e.g. during the gap between a feed-sync push and the
# next sync.yml run).
#
# Keep the two lists in sync with the site layout:
#   - every non-site file added at the repository root MUST be excluded here;
#   - the site files are the rest (index.html, section dirs, js/, assets/,
#     feeds/, apps/, flat feed copies, catalog.json, sitemap.xml, robots.txt).
#
# See .github/workflows/README.md for the full explanation.
# ============================================================================

exclude:
  # Repository internals (never part of the published site).
  - config
  - docs
  - schemas
  - scripts
  - sdk
  - src
  - tests
  - Makefile
  - pyproject.toml
  - requirements.txt
  - CHANGES.md
  - CONTRIBUTING.md
  - DEPLOYMENT-GUIDE.md
  - FINAL-SUMMARY.txt
  - IMPLEMENTATION-SUMMARY.md
  - LICENSE
  - README.md
  - README-FEATURES.md
  - SECURITY.md
  # Pipeline runtime state — internal, and excluded from _site/ as well.
  - feeds/state.json
