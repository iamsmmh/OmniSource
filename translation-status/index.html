<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translation status — OmniSource</title><link rel="stylesheet" href="../assets/design-system/tokens.css"><link rel="stylesheet" href="../assets/design-system/components.css"><script src="../src/js/i18n.js" defer></script><style>body{max-width:760px;margin:4rem auto;padding:1rem;font-family:var(--font-sans);color:var(--text)}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:1rem 0}.value{font-weight:700}</style></head><body><h1 data-i18n="pages.translationStatus">Translation status</h1><p data-i18n="pages.coverage">Translation coverage</p><main id="status" aria-live="polite"></main><script>document.addEventListener('DOMContentLoaded',()=>{let b=/\.github\.io$/.test(location.hostname)?'/OmniSource':'';fetch(b+'/api/translation-status.json').then(r=>r.json()).then(d=>{status.innerHTML=Object.entries(d).map(([l,v])=>`<div class="metric"><span>${l}</span><span class="value">${v}%</span></div>`).join('')}).catch(()=>status.textContent='Unable to load translation status offline.')})</script></body></html>
