name: OmniSource Full Sync & Build

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Homebrew & iOS Toolchain Dependencies
        run: |
          brew install ldid dpkg make
          sudo mkdir -p /opt/theos
          sudo chown -R $(id -u):$(id -g) /opt/theos

      - name: Set up Theos Environment
        run: |
          if [ ! -d "/opt/theos/.git" ]; then
            git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          rm -rf /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Feed Sync & Compilation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          THEOS: /opt/theos
        run: |
          python3 -c "
          import json, urllib.request, urllib.error, os, datetime, subprocess

          source_owner = 'iamsmmh'
          base_url = 'https://' + source_owner + '.github.io/OmniSource'

          headers = {'User-Agent': 'Mozilla/5.0'}
          token = os.environ.get('GH_TOKEN')
          if token:
              headers['Authorization'] = 'token ' + token

          master_apps = []

          # Configure custom source icon and banner paths using OmniSource.png
          source_icon_url = base_url + '/assets/OmniSource.png' if os.path.exists(os.path.join('assets', 'OmniSource.png')) else base_url + '/assets/icon.png'
          banner_url = base_url + '/assets/banner.png' if os.path.exists(os.path.join('assets', 'banner.png')) else source_icon_url

          # =========================================================================
          # PART 1: Handle uYouEnhanced
          # =========================================================================
          uyou_config = {
              'json_file': 'uyouenhanced.json',
              'bundleIdentifier': 'com.google.ios.youtube.uyouenhanced',
              'name': 'uYouEnhanced',
              'developerName': 'arichornlover & Various Contributors',
              'subtitle': 'uYou Extended with Modern Fixes & SponsorBlock',
              'tintColor': 'FF0000',
              'icon_filename': 'YouTube.png'
          }

          target_app = None
          try:
              alt_source_url = 'https://raw.githubusercontent.com/arichornlover/arichornlover.github.io/main/apps.json'
              req = urllib.request.Request(alt_source_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  alt_data = json.loads(resp.read().decode())
                  
              for app in alt_data.get('apps', []):
                  if 'youtube' in app.get('bundleIdentifier', '').lower() or 'uyou' in app.get('name', '').lower():
                      target_app = app
                      break
          except Exception as e:
              print('Warning: Upstream AltStore feed query failed: ' + str(e))

          if target_app:
              tag = target_app.get('version', '3.0.4')
              pub_date = target_app.get('versionDate', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              body = target_app.get('localizedDescription', 'uYouEnhanced official community release.')
              ipa_url = target_app.get('downloadURL', '')
              asset_size = target_app.get('size', 120000000)

              icon_url = base_url + '/assets/' + uyou_config['icon_filename'] if os.path.exists(os.path.join('assets', uyou_config['icon_filename'])) else source_icon_url

              app_data = {
                  'name': uyou_config['name'],
                  'bundleIdentifier': uyou_config['bundleIdentifier'],
                  'developerName': uyou_config['developerName'],
                  'subtitle': uyou_config['subtitle'],
                  'localizedDescription': body,
                  'iconURL': icon_url,
                  'tintColor': uyou_config['tintColor'],
                  'version': tag,
                  'versionDate': pub_date,
                  'versionDescription': body,
                  'downloadURL': ipa_url,
                  'size': int(asset_size),
                  'versions': target_app.get('versions', [{
                      'version': tag,
                      'date': pub_date,
                      'localizedDescription': body,
                      'downloadURL': ipa_url,
                      'size': int(asset_size)
                  }])
              }

              standalone_source = {
                  'name': 'OmniSource - uYouEnhanced',
                  'identifier': 'com.' + source_owner.lower() + '.omnisource.uyouenhanced',
                  'subtitle': 'uYouEnhanced Standalone Feed',
                  'description': 'Standalone source for uYouEnhanced. Developed by ' + uyou_config['developerName'] + '. Maintained by ' + source_owner + '.',
                  'iconURL': source_icon_url,
                  'bannerURL': banner_url,
                  'website': base_url,
                  'apps': [app_data]
              }

              with open(uyou_config['json_file'], 'w', encoding='utf-8') as f:
                  json.dump(standalone_source, f, indent=2, ensure_ascii=False)
              print('Successfully processed: uyouenhanced.json')
              master_apps.append(app_data)

          # =========================================================================
          # PART 2: Fetch remaining apps (SpotiFLAC & YouProEXTRA suite) via GitHub API
          # =========================================================================
          apps_config = [
              {
                  'repo_owner': 'spotiflacapp',
                  'repo_name': 'SpotiFLAC-Mobile',
                  'json_file': 'spotiflac.json',
                  'bundleIdentifier': 'com.zarzet.spotiflac',
                  'name': 'SpotiFLAC Mobile',
                  'developerName': 'zarzet',
                  'subtitle': 'FLAC Downloader for iOS',
                  'tintColor': '1DB954',
                  'icon_url_fallback': 'https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Mobile/main/assets/images/logo.png',
                  'asset_keyword': 'spotiflac'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkace.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkace',
                  'name': 'YTKACE',
                  'developerName': 'itzzace',
                  'subtitle': 'Open-Source YouTube Enhancer with SponsorBlock',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytkace'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'youpro.json',
                  'bundleIdentifier': 'com.google.ios.youtube.youpro',
                  'name': 'YouPro',
                  'developerName': 'Alibusut',
                  'subtitle': 'YouTube Mod with Premium Features & Downloader',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'youpro'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytlite.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytlite',
                  'name': 'YTLite',
                  'developerName': 'Dayanch96',
                  'subtitle': 'Lightweight & Highly Customizable YouTube Mod',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytlite'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkp.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkp',
                  'name': 'YTKillerPlus',
                  'developerName': 'IKillerApp',
                  'subtitle': 'All-in-One YouTube Downloader & Tweak Suite',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytkiller'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YTMusicUltimate',
                  'json_file': 'ytmusic.json',
                  'bundleIdentifier': 'com.google.ios.youtubemusic',
                  'name': 'YTMusicUltimate',
                  'developerName': 'Dayanch96',
                  'subtitle': 'YouTube Music with Background Play & No Ads',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTubeMusic.png',
                  'asset_keyword': 'ytmusic'
              }
          ]

          for config in apps_config:
              owner = config['repo_owner']
              repo = config['repo_name']
              json_file = config['json_file']
              keyword = config.get('asset_keyword', '').lower()
              
              url = 'https://api.github.com/repos/' + owner + '/' + repo + '/releases/latest'
              release = None

              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      release = json.loads(response.read().decode())
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      fallback_url = 'https://api.github.com/repos/' + owner + '/' + repo + '/releases'
                      try:
                          req = urllib.request.Request(fallback_url, headers=headers)
                          with urllib.request.urlopen(req) as response:
                              releases = json.loads(response.read().decode())
                              if releases and isinstance(releases, list):
                                  release = releases[0]
                      except Exception as e:
                          print('Fallback release query failed for ' + repo + ': ' + str(e))
              except Exception as e:
                  print('Failed to query GitHub API for ' + repo + ': ' + str(e))

              if not release:
                  print('Skipping ' + config['name'] + ': Release metadata unavailable.')
                  continue

              raw_tag = release.get('tag_name', '1.0.0')
              tag = raw_tag.lstrip('v')
              pub_date = release.get('published_at', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              body = release.get('body', 'Official release maintained by ' + config['developerName'] + '.')
              
              ipa_url = ''
              asset_size = 35967116
              assets = release.get('assets', [])

              for asset in assets:
                  name = asset.get('name', '').lower()
                  if (name.endswith('.ipa') or name.endswith('.tipa')) and (not keyword or keyword in name):
                      ipa_url = asset.get('browser_download_url', '')
                      asset_size = asset.get('size', asset_size)
                      break

              if not ipa_url:
                  for asset in assets:
                      name = asset.get('name', '').lower()
                      if name.endswith('.ipa') or name.endswith('.tipa'):
                          ipa_url = asset.get('browser_download_url', '')
                          asset_size = asset.get('size', asset_size)
                          break

              if not ipa_url:
                  print('Skipping ' + config['name'] + ': No IPA binary found.')
                  continue

              if 'icon_url_fallback' in config:
                  icon_url = config['icon_url_fallback']
              else:
                  icon_file = config.get('icon_filename', '')
                  if icon_file and os.path.exists(os.path.join('assets', icon_file)):
                      icon_url = base_url + '/assets/' + icon_file
                  else:
                      icon_url = source_icon_url

              clean_name = config['name'].lower().replace(' ', '')

              app_data = {
                  'name': config['name'],
                  'bundleIdentifier': config['bundleIdentifier'],
                  'developerName': config['developerName'],
                  'subtitle': config['subtitle'],
                  'localizedDescription': body,
                  'iconURL': icon_url,
                  'tintColor': config['tintColor'],
                  'version': tag,
                  'versionDate': pub_date,
                  'versionDescription': body,
                  'downloadURL': ipa_url,
                  'size': int(asset_size),
                  'versions': [
                      {
                          'version': tag,
                          'date': pub_date,
                          'localizedDescription': body,
                          'downloadURL': ipa_url,
                          'size': int(asset_size)
                      }
                  ]
              }

              standalone_source = {
                  'name': 'OmniSource - ' + config['name'],
                  'identifier': 'com.' + source_owner.lower() + '.omnisource.' + clean_name,
                  'subtitle': config['name'] + ' Standalone Feed',
                  'description': 'Standalone source for ' + config['name'] + '. Developed by ' + config['developerName'] + '. Maintained by ' + source_owner + '.',
                  'iconURL': source_icon_url,
                  'bannerURL': banner_url,
                  'website': base_url,
                  'apps': [app_data]
              }

              try:
                  with open(json_file, 'w', encoding='utf-8') as f:
                      json.dump(standalone_source, f, indent=2, ensure_ascii=False)
                  print('Successfully updated: ' + json_file)
              except Exception as e:
                  print('Failed writing ' + json_file + ': ' + str(e))

              master_apps.append(app_data)

          if master_apps:
              master_source = {
                  'name': 'OmniSource',
                  'identifier': 'com.' + source_owner.lower() + '.omnisource',
                  'subtitle': 'Consolidated iOS Applications & Tweaks Repository',
                  'description': 'Master AltStore / SideStore source curated by ' + source_owner + '. Full credit to original developers.',
                  'iconURL': source_icon_url,
                  'bannerURL': banner_url,
                  'website': base_url,
                  'apps': master_apps
              }
              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(master_source, f, indent=2, ensure_ascii=False)
              print('Successfully updated: apps.json')
          "

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json

          git commit -m "chore(feed): configure OmniSource.png as source icon [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
