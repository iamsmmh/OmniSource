name: OmniSource Build & Feed Sync

on:
  schedule:
    - cron: "0 */12 * * *" # Runs automatically every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: Build uYouEnhanced IPA from Upstream Source & Publish Release
  # =========================================================================
  build-uyouenhanced:
    runs-on: macos-14
    outputs:
      release_tag: ${{ steps.build.outputs.TAG_NAME }}
    steps:
      - name: Checkout uYouEnhanced Upstream
        uses: actions/checkout@v4
        with:
          repository: arichornlover/uYouEnhanced
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Setup Dependencies
        run: |
          brew install theos
          pip3 install pyyaml

      - name: Fetch Decrypted YouTube IPA & Build
        id: build
        run: |
          # Retrieve latest upstream tag
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v3.0.4")
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

          # Fetch decrypted YouTube base IPA (Mirror maintained for automated builds)
          curl -sL "https://archive.org/download/YouTube_Decrypted_Base/YouTube_Decrypted.ipa" -o YouTube.ipa

          # Compile tweaked IPA using Theos
          make clean
          make package FINALPACKAGE=1 IPA=YouTube.ipa

          # Identify generated package
          IPA_PATH=$(find packages -name "*.ipa" | head -n 1)
          echo "OUTPUT_IPA=${IPA_PATH}" >> $GITHUB_ENV

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.TAG_NAME }}
          name: "uYouEnhanced ${{ steps.build.outputs.TAG_NAME }}"
          body: "Automated uYouEnhanced build compiled from official upstream repository `arichornlover/uYouEnhanced`."
          files: ${{ env.OUTPUT_IPA }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # =========================================================================
  # JOB 2: Generate & Update AltStore / SideStore JSON Feed Repositories
  # =========================================================================
  update-repos:
    needs: build-uyouenhanced
    if: always() # Runs even if build step is skipped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Latest Releases & Rebuild Sources
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c "
          import json, urllib.request, urllib.error, os, datetime

          source_owner = 'iamsmmh'
          base_url = f'https://{source_owner}.github.io/OmniSource'

          apps_config = [
              {
                  'repo_owner': 'spotiflacapp',
                  'repo_name': 'SpotiFLAC-Mobile',
                  'json_file': 'spotiflac.json',
                  'bundleIdentifier': 'com.spotiflac.mobile',
                  'name': 'SpotiFLAC Mobile',
                  'developerName': 'spotiflacapp',
                  'subtitle': 'Lossless FLAC Music Downloader & Player',
                  'tintColor': '1DB954',
                  'icon_filename': 'SpotiFLAC.png',
                  'asset_keyword': 'spotiflac'
              },
              {
                  'repo_owner': 'arichornlover',
                  'repo_name': 'uYouEnhanced',
                  'json_file': 'uyouenhanced.json',
                  'bundleIdentifier': 'com.google.ios.youtube.uyouenhanced',
                  'name': 'uYouEnhanced',
                  'developerName': 'arichornlover & MiRO92',
                  'subtitle': 'uYou Extended with Modern Fixes & SponsorBlock',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'uyouenhanced',
                  # Direct fallback pointing to your automated compiled build release assets
                  'fallback_ipa_pattern': f'https://github.com/{source_owner}/uYouEnhanced-Builds/releases/download/{{raw_tag}}/uYouEnhanced_{{raw_tag}}.ipa'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkace.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkace',
                  'name': 'YTKACE',
                  'developerName': 'itzzace & mrdrvt99',
                  'subtitle': 'Open-Source YouTube Enhancer with SponsorBlock',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytkace'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'youpro.json',
                  'bundleIdentifier': 'com.google.ios.youtube.youpro',
                  'name': 'YouPro',
                  'developerName': 'Alibusut & mrdrvt99',
                  'subtitle': 'YouTube Mod with Premium Features & Downloader',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'youpro'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytlite.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytlite',
                  'name': 'YTLite',
                  'developerName': 'Dayanch96 & mrdrvt99',
                  'subtitle': 'Lightweight & Highly Customizable YouTube Mod',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytlite'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkp.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkp',
                  'name': 'YTKillerPlus',
                  'developerName': 'IKillerApp & mrdrvt99',
                  'subtitle': 'All-in-One YouTube Downloader & Tweak Suite',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTube.png',
                  'asset_keyword': 'ytkiller'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YTMusicUltimate',
                  'json_file': 'ytmusic.json',
                  'bundleIdentifier': 'com.google.ios.youtubemusic',
                  'name': 'YTMusicUltimate',
                  'developerName': 'Dayanch96 & mrdrvt99',
                  'subtitle': 'YouTube Music with Background Play & No Ads',
                  'tintColor': 'FF0000',
                  'icon_filename': 'YouTubeMusic.png',
                  'asset_keyword': 'ytmusic'
              }
          ]

          headers = {'User-Agent': 'Mozilla/5.0'}
          token = os.environ.get('GH_TOKEN')
          if token:
              headers['Authorization'] = f'token {token}'

          master_apps = []

          for config in apps_config:
              owner = config['repo_owner']
              repo = config['repo_name']
              json_file = config['json_file']
              keyword = config.get('asset_keyword', '').lower()
              
              url = f'https://api.github.com/repos/{owner}/{repo}/releases/latest'
              release = None

              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      release = json.loads(response.read().decode())
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      fallback_url = f'https://api.github.com/repos/{owner}/{repo}/releases'
                      try:
                          req = urllib.request.Request(fallback_url, headers=headers)
                          with urllib.request.urlopen(req) as response:
                              releases = json.loads(response.read().decode())
                              if releases and isinstance(releases, list):
                                  release = releases[0]
                      except Exception as e:
                          print(f'Fallback release query failed for {repo}: {e}')
                  else:
                      print(f'HTTP error {err.code} fetching {repo}: {err.reason}')
              except Exception as e:
                  print(f'Failed to query GitHub API for {repo}: {e}')

              if release:
                  raw_tag = release.get('tag_name', '1.0.0')
                  tag = raw_tag.lstrip('v')
                  pub_date = release.get('published_at', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
                  body = release.get('body', f"Official release maintained by {config['developerName']}.")
                  
                  ipa_url = ''
                  asset_size = 120000000
                  assets = release.get('assets', [])

                  # Step 1: Match keyword in multi-asset releases
                  if keyword:
                      for asset in assets:
                          name = asset.get('name', '').lower()
                          if (name.endswith('.ipa') or name.endswith('.tipa')) and keyword in name:
                              ipa_url = asset.get('browser_download_url', '')
                              asset_size = asset.get('size', asset_size)
                              break

                  # Step 2: Grab primary attached .ipa or .tipa file
                  if not ipa_url:
                      for asset in assets:
                          name = asset.get('name', '').lower()
                          if name.endswith('.ipa') or name.endswith('.tipa'):
                              ipa_url = asset.get('browser_download_url', '')
                              asset_size = asset.get('size', asset_size)
                              break

                  # Step 3: Handle upstream source repos without attached binaries (e.g. uYouEnhanced)
                  if not ipa_url and 'fallback_ipa_pattern' in config:
                      ipa_url = config['fallback_ipa_pattern'].format(tag=tag, raw_tag=raw_tag)
                      print(f"Using constructed fallback IPA link for {config['name']}: {ipa_url}")

                  if not ipa_url:
                      print(f"Skipping {config['name']}: No IPA binary found.")
                      continue
              else:
                  print(f"Skipping {config['name']}: Release metadata unavailable.")
                  continue

              icon_file = config.get('icon_filename', '')
              if icon_file and os.path.exists(os.path.join('assets', icon_file)):
                  icon_url = f'{base_url}/assets/{icon_file}'
              elif os.path.exists('assets/icon.png'):
                  icon_url = f'{base_url}/assets/icon.png'
              else:
                  icon_url = f'https://raw.githubusercontent.com/{source_owner}/OmniSource/main/assets/icon.png'

              clean_name = config['name'].lower().replace(' ', '')

              app_data = {
                  'name': config['name'],
                  'bundleIdentifier': config['bundleIdentifier'],
                  'developerName': config['developerName'],
                  'subtitle': config['subtitle'],
                  'localizedDescription': body,
                  'iconURL': icon_url,
                  'tintColor': config['tintColor'],
                  'version': tag,
                  'versionDate': pub_date,
                  'versionDescription': body,
                  'downloadURL': ipa_url,
                  'size': int(asset_size),
                  'versions': [
                      {
                          'version': tag,
                          'date': pub_date,
                          'localizedDescription': body,
                          'downloadURL': ipa_url,
                          'size': int(asset_size)
                      }
                  ]
              }

              standalone_source = {
                  'name': 'OmniSource',
                  'identifier': f"com.{source_owner.lower()}.omnisource.{clean_name}",
                  'subtitle': f"{config['name']} Feed",
                  'description': f"Feed for {config['name']}. Developed by {config['developerName']}. Maintained by {source_owner}.",
                  'iconURL': f"{base_url}/assets/icon.png",
                  'website': base_url,
                  'apps': [app_data]
              }

              try:
                  with open(json_file, 'w', encoding='utf-8') as f:
                      json.dump(standalone_source, f, indent=2, ensure_ascii=False)
                  print(f'Successfully updated: {json_file}')
              except Exception as e:
                  print(f'Failed writing {json_file}: {e}')

              master_apps.append(app_data)

          if master_apps:
              master_source = {
                  'name': 'OmniSource',
                  'identifier': f'com.{source_owner.lower()}.omnisource',
                  'subtitle': 'Consolidated iOS Applications & Tweaks Repository',
                  'description': f'Master AltStore / SideStore source curated by {source_owner}. Full credit to original developers.',
                  'iconURL': f'{base_url}/assets/icon.png',
                  'website': base_url,
                  'apps': master_apps
              }
              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(master_source, f, indent=2, ensure_ascii=False)
              print('Successfully updated: apps.json')
          "

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json

          if ! git diff --staged --quiet; then
            git commit -m "chore(feed): auto-sync feeds & update app specs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No structural JSON changes detected."
          fi
