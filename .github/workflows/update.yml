name: Sync & Update OmniSource Repositories

on:
  schedule:
    - cron: "0 */6 * * *" # Automatically run every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Latest Releases & Rebuild Sources
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c "
          import json, urllib.request, os, datetime

          source_owner = 'iamsmmh'
          base_url = f'https://{source_owner}.github.io/OmniSource'

          # Official upstream configurations matching latest builds & developer attributions
          apps_config = [
              {
                  'repo_owner': 'iamsmmh',
                  'repo_name': 'SpotiFLAC-Mobile-Repo',
                  'json_file': 'spotiflac.json',
                  'bundleIdentifier': 'com.spotiflac.mobile',
                  'name': 'SpotiFLAC Mobile',
                  'developerName': 'spotiflacapp',
                  'subtitle': 'Lossless FLAC Music Downloader & Player',
                  'tintColor': '1DB954'
              },
              {
                  'repo_owner': 'arichornlover',
                  'repo_name': 'uYouEnhanced',
                  'json_file': 'uyouenhanced.json',
                  'bundleIdentifier': 'com.google.ios.youtube.uyouenhanced',
                  'name': 'uYouEnhanced',
                  'developerName': 'arichornlover & MiRO92',
                  'subtitle': 'uYou Extended with Modern Fixes & SponsorBlock',
                  'tintColor': 'FF0000'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkace.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkace',
                  'name': 'YTKACE',
                  'developerName': 'itzzace & mrdrvt99',
                  'subtitle': 'Open-Source YouTube Enhancer with SponsorBlock',
                  'tintColor': 'FF0000'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'youpro.json',
                  'bundleIdentifier': 'com.google.ios.youtube.youpro',
                  'name': 'YouPro',
                  'developerName': 'Alibusut & mrdrvt99',
                  'subtitle': 'YouTube Mod with Premium Features & Downloader',
                  'tintColor': 'FF0000'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytlite.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytlite',
                  'name': 'YTLite',
                  'developerName': 'Dayanch96 & mrdrvt99',
                  'subtitle': 'Lightweight & Highly Customizable YouTube Mod',
                  'tintColor': 'FF0000'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YouProEXTRA',
                  'json_file': 'ytkp.json',
                  'bundleIdentifier': 'com.google.ios.youtube.ytkp',
                  'name': 'YTKillerPlus',
                  'developerName': 'IKillerApp & mrdrvt99',
                  'subtitle': 'All-in-One YouTube Downloader & Tweak Suite',
                  'tintColor': 'FF0000'
              },
              {
                  'repo_owner': 'mrdrvt99',
                  'repo_name': 'YTMusicUltimate',
                  'json_file': 'ytmusic.json',
                  'bundleIdentifier': 'com.google.ios.youtubemusic',
                  'name': 'YTMusicUltimate',
                  'developerName': 'Dayanch96 & mrdrvt99',
                  'subtitle': 'YouTube Music with Background Play & No Ads',
                  'tintColor': 'FF0000'
              }
          ]

          headers = {'User-Agent': 'Mozilla/5.0'}
          if os.environ.get('GH_TOKEN'):
              headers['Authorization'] = f\"token {os.environ.get('GH_TOKEN')}\"

          master_apps = []

          for config in apps_config:
              owner = config['repo_owner']
              repo = config['repo_name']
              json_file = config['json_file']
              url = f'https://api.github.com/repos/{owner}/{repo}/releases/latest'

              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      release = json.loads(response.read().decode())

                  tag = release.get('tag_name', '1.0.0').lstrip('v')
                  pub_date = release.get('published_at', datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
                  body = release.get('body', f\"Official release maintained by {config['developerName']}.\")

                  ipa_url = ''
                  asset_size = 120000000
                  for asset in release.get('assets', []):
                      name = asset.get('name', '').lower()
                      if name.endswith('.ipa') or name.endswith('.tipa'):
                          ipa_url = asset.get('browser_download_url', '')
                          asset_size = asset.get('size', asset_size)
                          break

                  if not ipa_url:
                      ipa_url = f'https://github.com/{owner}/{repo}/releases'

                  clean_name = config['name'].lower().replace(' ', '')
                  icon_filename = f\"{clean_name}.png\"
                  if os.path.exists(os.path.join('assets', icon_filename)):
                      icon_url = f'{base_url}/assets/{icon_filename}'
                  elif os.path.exists('assets/icon.png'):
                      icon_url = f'{base_url}/assets/icon.png'
                  else:
                      icon_url = f'https://raw.githubusercontent.com/{source_owner}/OmniSource/main/assets/icon.png'

                  app_data = {
                      'name': config['name'],
                      'bundleIdentifier': config['bundleIdentifier'],
                      'developerName': config['developerName'],
                      'subtitle': config['subtitle'],
                      'localizedDescription': body,
                      'iconURL': icon_url,
                      'tintColor': config['tintColor'],
                      'version': tag,
                      'versionDate': pub_date,
                      'versionDescription': body,
                      'downloadURL': ipa_url,
                      'size': int(asset_size),
                      'versions': [
                          {
                              'version': tag,
                              'date': pub_date,
                              'localizedDescription': body,
                              'downloadURL': ipa_url,
                              'size': int(asset_size)
                          }
                      ]
                  }

                  standalone_source = {
                      'name': f\"OmniSource - {config['name']}\",
                      'identifier': f\"com.{source_owner.lower()}.omnisource.{clean_name}\",
                      'subtitle': f\"{config['name']} Standalone Feed\",
                      'description': f\"Standalone source for {config['name']}. Developed by {config['developerName']}. Maintained by {source_owner}.\",
                      'iconURL': f\"{base_url}/assets/icon.png\",
                      'website': base_url,
                      'apps': [app_data]
                  }

                  with open(json_file, 'w', encoding='utf-8') as f:
                      json.dump(standalone_source, f, indent=2, ensure_ascii=False)
                  print(f'Successfully updated: {json_file}')

                  master_apps.append(app_data)

              except Exception as e:
                  print(f'Failed to process {repo} ({config[\"name\"]}): {e}')

          if master_apps:
              master_source = {
                  'name': 'OmniSource',
                  'identifier': f'com.{source_owner.lower()}.omnisource',
                  'subtitle': 'Consolidated iOS Applications & Tweaks Repository',
                  'description': f'Master AltStore / SideStore source curated by {source_owner}. Full credit to original developers.',
                  'iconURL': f'{base_url}/assets/icon.png',
                  'website': base_url,
                  'apps': master_apps
              }
              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(master_source, f, indent=2, ensure_ascii=False)
              print('Successfully updated: apps.json')
          "

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json

          if ! git diff --staged --quiet; then
            git commit -m "chore(feed): sync update apps JSON files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in repository."
          fi
