name: Copilot Autonomous Agent

on:
  issues:
    types: [assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  copilot-task:
    if: github.event.assignee.login == 'github-copilot[bot]' || contains(github.event.issue.labels.*.name, 'copilot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Delegate to Copilot Agent
        uses: github/copilot-action@v1
        with:
          issue-number: ${{ github.event.issue.number }}
          auto-pr: true
