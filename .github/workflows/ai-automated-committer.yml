name: AI Automated Committer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-commit:
    if: contains(github.event.comment.body, '@ai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI SDK
        run: |
          pip install google-genai

      - name: Run AI Code Modifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 -c "
          import os
          from google import genai

          prompt = f'''You are an automated software engineer.
          Task Context:
          Issue Title: {os.environ.get('ISSUE_TITLE')}
          Issue Body: {os.environ.get('ISSUE_BODY')}
          User Instruction: {os.environ.get('COMMENT_BODY')}

          Analyze the request and apply necessary changes directly to local codebase files.'''

          api_key = os.environ.get('GEMINI_API_KEY')
          if api_key:
              client = genai.Client(api_key=api_key)
              response = client.models.generate_content(
                  model='gemini-2.5-flash',
                  contents=prompt
              )
              print('AI processing completed.')
          "

      - name: Create Pull Request with AI Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(ai): automated code modification from comment trigger"
          branch: "ai-auto-fixes-${{ github.event.issue.number }}"
          title: "AI Auto-Fix for Issue #${{ github.event.issue.number }}"
          body: |
            Automated PR generated by AI in response to comment:
            ${{ github.event.comment.body }}
          labels: "ai-generated, automated-pr"
