# -----------------------------------------------------------------------------
# Validation for pull requests and direct pushes.
#
# Everything here is offline and read-only, so it is safe to run on forks:
# no token, no network, no write permission. Jobs are split so the structural
# gate (fast), the unit tests (matrix) and the linters (slow, cached) run in
# parallel instead of serially.
# -----------------------------------------------------------------------------
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Catalog, feeds, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and feeds
        run: python3 scripts/validate.py

      # jq-only lint + AltStore v2 structural assertions. Offline and read-only.
      - name: Lint JSON with jq
        run: bash scripts/validate_jq.sh

      # Guards the invariant that feeds/ and apps/ are generated, never
      # hand-edited: a rebuild from committed state must be a no-op.
      # Date-stamped values (generatedAt, lastSync, RSS timestamps, analytics
      # history) are normalized so a PR opened on a different day still
      # passes; any real content drift fails.
      - name: Verify generated artifacts are reproducible
        run: python3 scripts/check_reproducible.py --diff

  tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  lint:
    name: Lint (ruff + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runtime is stdlib-only; ruff is the only cached dependency.
      # Pinned exact versions keep an upstream release from turning an
      # unrelated pull request red.
      - name: Cache ruff wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ruff-${{ runner.os }}-0.16

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check Python style
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "ruff>=0.16.0"
          python3 -m ruff check src/ scripts/ tests/
          python3 -m ruff format --check src/ scripts/ tests/

      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color
