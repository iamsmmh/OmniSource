# -----------------------------------------------------------------------------
# Validation for pull requests and direct pushes.
#
# Everything here is offline and read-only, so it is safe to run on forks:
# no token, no network, no write permission. Jobs are split so the structural
# gate (fast), the unit tests (matrix) and the linters (slow, cached) run in
# parallel instead of serially.
# -----------------------------------------------------------------------------
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Catalog, feeds, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and feeds
        run: python3 scripts/validate.py

      # jq-only lint + AltStore v2 structural assertions. Offline and read-only.
      - name: Lint JSON with jq
        run: bash scripts/validate_jq.sh

      # Guards the invariant that feeds/ and apps/ are generated, never
      # hand-edited: a rebuild from committed state must be a no-op.
      # Date-stamped values (generatedAt, lastSync, RSS timestamps, analytics
      # history) are normalized so a PR opened on a different day still
      # passes; any real content drift fails.
      - name: Verify generated artifacts are reproducible
        run: python3 scripts/check_reproducible.py --diff

  tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  lint:
    name: Lint (ruff + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runtime is stdlib-only; ruff is the only cached dependency.
      # The cache holds downloaded wheels, so repeated runs reuse them.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ruff-${{ runner.os }}-0.16

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python style
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "ruff==0.16.6"
          python3 -m ruff check src/ scripts/ tests/
          python3 -m ruff format --check src/ scripts/ tests/

      # actionlint pinned via its release binary (no docker image to pull).
      # The upstream checksums.txt escapes every underscore with a backslash
      # (e.g. actionlint\_1.7.12\_linux\_amd64.tar.gz), so unescape it before
      # extracting the linux-amd64 hash and verifying the downloaded archive.
      - name: Lint workflows
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt" -o /tmp/actionlint.sha256
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tr -d '\\' < /tmp/actionlint.sha256 | grep 'linux_amd64.tar.gz$' | awk '{print $1}' > /tmp/actionlint.expected
          echo "$(cat /tmp/actionlint.expected)  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
