# -----------------------------------------------------------------------------
# Primary pipeline: sync upstream releases, rebuild every feed, publish the site.
#
# This is the only workflow that writes to the repository. It replaces the
# previous omnisource-build-sync.yml + updatex.yml pair, which raced each other
# for apps.json on overlapping 12h/13h schedules.
# -----------------------------------------------------------------------------
name: Sync & Publish

on:
  schedule:
    # Every 6 hours. Upstream mods usually ship within a few hours of a
    # YouTube release; twice a day was consistently too slow.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - catalog.json
      - assets/**
      - scripts/**
      - src/**
      - website/**
      - .github/workflows/sync.yml
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Rebuild feeds from feeds/state.json without calling the GitHub API"
        type: boolean
        default: false
      skip_health:
        description: "Skip download-link probing"
        type: boolean
        default: false

# Never let two runs write feeds at the same time, and never cancel a run
# midway through a commit.
concurrency:
  group: sync-publish
  cancel-in-progress: false

# Read-only by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  build:
    name: Sync, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuse the provider HTTP response cache between runs: stdlib-only runtime,
      # metadata only (never IPA payloads). Cache writes are opaque to the build.
      - name: Cache upstream metadata
        uses: actions/cache@v4
        with:
          path: .cache/omnisource
          key: omnisource-http-${{ runner.os }}
          restore-keys: |
            omnisource-http-

      # src/omnisource is stdlib-only on purpose: no pip install, no lockfile
      # drift, no third-party code executing with a write-scoped token.
      # Scheduled runs are incremental (skip pagination when the newest asset
      # URL is unchanged). A catalog push always does a full sync.
      - name: Build feeds
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          OMNISOURCE_WEBHOOK_URL: ${{ secrets.OMNISOURCE_WEBHOOK_URL }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA="--incremental"
          fi
          python3 scripts/omnisource.py \
            ${{ inputs.skip_sync && '--no-sync' || '' }} \
            ${{ inputs.skip_health && '--no-health' || '' }} \
            $EXTRA

      # Test gate: the commit step below only runs if every check here is
      # green (GitHub Actions skips the rest of the job on any failure). This
      # is the same suite validate.yml requires on PRs, so a scheduled sync or
      # a dispatch run can never publish feeds, pages or README changes that
      # would fail a pull request.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate output
        run: python3 scripts/validate.py

      # jq-only lint + AltStore v2 structural assertions.
      - name: Lint JSON with jq
        run: bash scripts/validate_jq.sh

      # A rebuild from the freshly generated state must be a no-op: proves
      # the build is deterministic and nothing was hand-edited mid-run.
      - name: Verify generated artifacts are reproducible
        run: python3 scripts/check_reproducible.py

      - name: Commit changes
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # feeds JSON/XML, generated app detail pages and the README blocks,
          # plus the published website (root site files for branch-backed Pages)
          git add -A -- '*.json' '*.xml' 'apps/**' README.md \
            'index.html' 'compare.html' 'js' 'compare' 'status' 'analytics' 'install' 'search' 'api' 'assets' \
            'sw.js' 'manifest.webmanifest' 'feed.xml' 'sitemap.xml' 'robots.txt' '.nojekyll'

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes."
            exit 0
          fi

          git commit -m "chore(feeds): sync upstream releases [skip ci]"
          # Rebase instead of force-push: a concurrent human commit must survive.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated feeds (debug artifact)
        uses: actions/upload-artifact@v4
        with:
          name: generated-feeds
          path: |
            feeds/*.json
            feeds/*.xml
            apps/**/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Pages site
        run: python3 scripts/build_site.py

      # Also mirror the built site into the repository root. GitHub Pages is
      # currently served in "legacy" (branch) mode, which publishes the branch
      # tree directly — so without this the live site would only see the raw
      # repo (README + website/ + feeds/), not the real web app. _site/ stays
      # gitignored; this publishes its contents to root so the branch-backed
      # deployment serves the genuine site. Harmless once Pages is switched to
      # GitHub Actions mode (that deploy path uses the _site artifact instead).
      # assets/, feeds/ and apps/ are published at root by the pipeline itself,
      # so they are skipped here to avoid clobbering them with build-time copies.
      - name: Publish site to repo root (branch-backed Pages)
        if: github.event_name != 'pull_request'
        run: |
          for item in _site/* _site/.[!.]*; do
            [ -e "$item" ] || continue
            base=$(basename "$item")
            case "$base" in assets|feeds|apps|_site) continue;; esac
            rm -rf "$base"
            cp -r "$item" .
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
