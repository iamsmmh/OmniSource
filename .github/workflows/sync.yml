# -----------------------------------------------------------------------------
# Primary pipeline: sync upstream releases, rebuild every feed, publish the site.
#
# This is the only workflow that writes to the repository. It replaces the
# previous omnisource-build-sync.yml + updatex.yml pair, which raced each other
# for apps.json on overlapping 12h/13h schedules.
# -----------------------------------------------------------------------------
name: Sync & Publish

on:
  schedule:
    # Every 6 hours. Upstream mods usually ship within a few hours of a
    # YouTube release; twice a day was consistently too slow.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - catalog.json
      - assets/**
      - scripts/**
      - src/**
      # Hand-maintained site sources live at the repository root, not in a
      # website/ dir (see docs/website.md). The published flat/API URLs are
      # refreshed into the root by the pipeline itself on every run, so they
      # need no trigger here either.
      - index.html
      - compare.html
      - compare/**
      - collections/**
      - favorites/**
      - install/**
      - analytics/**
      - search/**
      - status/**
      - js/**
      - manifest.webmanifest
      - sw.js
      - .github/workflows/sync.yml
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Rebuild feeds from feeds/state.json without calling the GitHub API"
        type: boolean
        default: false
      skip_health:
        description: "Skip download-link probing"
        type: boolean
        default: false

# Never let two runs write feeds at the same time, and never cancel a run
# midway through a commit.
concurrency:
  group: sync-publish
  cancel-in-progress: false

# Read-only by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  build:
    name: Sync, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuse the provider HTTP response cache between runs: stdlib-only runtime,
      # metadata only (never IPA payloads). Cache writes are opaque to the build.
      - name: Cache upstream metadata
        uses: actions/cache@v4
        with:
          path: .cache/omnisource
          key: omnisource-http-${{ runner.os }}
          restore-keys: |
            omnisource-http-

      # src/omnisource is stdlib-only on purpose: no pip install, no lockfile
      # drift, no third-party code executing with a write-scoped token.
      # Scheduled runs are incremental (skip pagination when the newest asset
      # URL is unchanged). A catalog push always does a full sync.
      - name: Build feeds
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          OMNISOURCE_WEBHOOK_URL: ${{ secrets.OMNISOURCE_WEBHOOK_URL }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA="--incremental"
          fi
          python3 scripts/omnisource.py \
            ${{ inputs.skip_sync && '--no-sync' || '' }} \
            ${{ inputs.skip_health && '--no-health' || '' }} \
            $EXTRA

      # Test gate: the commit step below only runs if every check here is
      # green (GitHub Actions skips the rest of the job on any failure). This
      # is the same suite validate.yml requires on PRs, so a scheduled sync or
      # a dispatch run can never publish feeds, pages or README changes that
      # would fail a pull request.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate output
        run: python3 scripts/validate.py

      # jq-only lint + AltStore v2 structural assertions.
      - name: Lint JSON with jq
        run: bash scripts/validate_jq.sh

      # A rebuild from the freshly generated state must be a no-op: proves
      # the build is deterministic and nothing was hand-edited mid-run.
      - name: Verify generated artifacts are reproducible
        run: python3 scripts/check_reproducible.py

      - name: Commit changes
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated feeds JSON/XML, app detail pages, static comparison +
          # collection pages, README blocks, and the published root mirror
          # (flat subscriber URLs, api/ + gz twins, sitemap, robots, homepage
          # stats) that GitHub Pages serves for this branch. The pipeline
          # writes nothing else, so the allowlist stays minimal on purpose:
          # a stray file here means the build misbehaved.
          git add -A -- '*.json' '*.xml' '*.gz' 'api/**' 'apps/**' 'compare/**' \
            'collections/**' README.md index.html 'sitemap.xml' 'robots.txt' '.nojekyll'

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes."
            exit 0
          fi

          # A concurrent run may have pushed identical content first; treat an
          # empty commit as "already published" instead of failing the run.
          if ! git commit -m "chore(feeds): sync upstream releases [skip ci]"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit (a concurrent run published first)."
            exit 0
          fi
          # Rebase instead of force-push: a concurrent human commit must survive.
          # A single transient fetch/push glitch (main can be busy right after
          # a merge) must not kill a scheduled run, so each step retries a
          # few times before failing.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git pull --rebase failed after 3 attempts"
              git status --porcelain | head -50
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated feeds (debug artifact)
        uses: actions/upload-artifact@v4
        with:
          name: generated-feeds
          path: |
            feeds/*.json
            feeds/*.xml
            apps/**/index.html
            compare/**/index.html
            collections/**/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Pages site
        run: python3 scripts/build_site.py

      # The deployable site (_site/) is published as a Pages artifact. This
      # path is used when Pages is set to *GitHub Actions*; while it is set to
      # *Deploy from a branch*, GitHub serves the repository root instead —
      # which the pipeline keeps complete (see scripts/publish_root.py).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
