name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Execute Enterprise-Grade Feed Compilation & Asset Routing Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c '
          import json, os, datetime

          so, bu = "iamsmmh", "https://iamsmmh.github.io/OmniSource"
          master_apps = []
          
          site_icon = f"{bu}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{bu}/assets/icon.png"
          banner_icon = f"{bu}/assets/banner.png" if os.path.exists("assets/banner.png") else site_icon

          def resolve_local_assets_and_bundle(name_key, id_key):
              name_lower = name_key.lower()
              id_lower = id_key.lower()
              
              if "music" in name_lower or "youtubemusic" in id_lower:
                  return f"{bu}/assets/YouTubeMusic.png", "com.google.ios.youtubemusic"
              elif "spotiflac" in name_lower or "zarzet" in id_lower:
                  return f"{bu}/assets/SpotiFLAC.png", "com.zarzet.spotiflac"
              else:
                  return f"{bu}/assets/YouTube.png", "com.google.ios.youtube"

          def standardize_app_metadata(app):
              name_key = app.get("name", "")
              id_key = app.get("bundleIdentifier", "")
              
              assigned_icon, target_bundle_id = resolve_local_assets_and_bundle(name_key, id_key)
              app["bundleIdentifier"] = target_bundle_id
              app["iconURL"] = assigned_icon

              if not app.get("versionDate"):
                  app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              
              if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                  app["versions"] = [{
                      "version": app.get("version"),
                      "date": app.get("versionDate"),
                      "localizedDescription": app.get("localizedDescription", "Stable production build."),
                      "downloadURL": app.get("downloadURL"),
                      "size": app.get("size", 120000000)
                  }]
              return app

          # Complete inventory of local standalone manifests maintained in the repository
          local_source_files = [
              "uyouenhanced.json", 
              "spotiflac.json", 
              "ytkace.json", 
              "youpro.json", 
              "ytlite.json", 
              "ytkp.json", 
              "ytmusic.json"
          ]

          for filepath in local_source_files:
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as file_in:
                          repo_data = json.load(file_in)
                      
                      apps_in_file = repo_data.get("apps", [])
                      for app_entry in apps_in_file:
                          validated_app = standardize_app_metadata(app_entry)
                          master_apps.append(validated_app)

                      # Synchronize standalone manifest metadata headers with local assets
                      if apps_in_file:
                          primary_icon = apps_in_file[0]["iconURL"]
                          repo_data["apps"][0]["iconURL"] = primary_icon
                          repo_data["iconURL"] = primary_icon
                          repo_data["bannerURL"] = banner_icon
                          
                          with open(filepath, "w", encoding="utf-8") as file_out:
                              json.dump(repo_data, file_out, indent=2, ensure_ascii=False)

                      print(f"Successfully compiled and synchronized standalone manifest: {filepath}")
                  except Exception as err:
                      print(f"Parsing error encountered on local manifest {filepath}: {err}")
              else:
                  print(f"Notice: Standalone file path not detected in workspace: {filepath}")

          # Compile and write out the comprehensive unified master apps.json feed
          if master_apps:
              master_feed_payload = {
                  "name": "OmniSource",
                  "identifier": f"com.{so.lower()}.omnisource",
                  "subtitle": "Consolidated iOS Applications & Tweaks Repository",
                  "description": f"Master AltStore and SideStore repository compiled and managed by {so}.",
                  "iconURL": site_icon,
                  "bannerURL": banner_icon,
                  "website": bu,
                  "apps": master_apps
              }
              with open("apps.json", "w", encoding="utf-8") as master_file:
                  json.dump(master_feed_payload, master_file, indent=2, ensure_ascii=False)
              print(f"Master feed successfully generated containing {len(master_apps)} application definitions.")
          else:
              print("Error: Compilation halted. No valid application definitions identified.")
          '

      - name: Commit and Push Repository Updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json *.json
          git commit -m "build(omnisource): enforce local repository assets, bundle standards, and compile master feed [skip ci]" || echo "No repository changes pending commit"
          git push origin HEAD:${{ github.ref_name }}
