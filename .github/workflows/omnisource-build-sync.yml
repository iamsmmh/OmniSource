name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync With Remote Before Build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase || echo "No rebase needed"

      - name: Execute Enterprise-Grade Feed Compilation & Asset Routing Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c '
          import json, os, datetime

          so, bu = "iamsmmh", "https://iamsmmh.github.io/OmniSource"
          master_apps = []

          site_icon = f"{bu}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{bu}/assets/icon.png"
          banner_icon = f"{bu}/assets/banner.png" if os.path.exists("assets/banner.png") else site_icon

          # Explicit per-file config: filename -> (icon filename, bundle id)
          FILE_CONFIG = {
              "uyouenhanced.json": ("uYouEnhanced.png", "com.google.ios.youtube"),
              "spotiflac.json":    ("SpotiFLAC.png",    "com.zarzet.spotiflac"),
              "ytkace.json":       ("YouTube.png",      "com.ytkace.youtube"),
              "youpro.json":       ("YouTube.png",      "com.youpro.youtube"),
              "ytlite.json":       ("YouTube.png",      "com.ytlite.youtube"),
              "ytkp.json":         ("YouTube.png",      "com.ytkp.youtube"),
              "ytmusic.json":      ("YouTubeMusic.png", "com.google.ios.youtubemusic"),
          }

          def standardize_app_metadata(app, icon_url, bundle_id):
              app["bundleIdentifier"] = bundle_id
              app["iconURL"] = icon_url

              if not app.get("versionDate"):
                  app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                  app["versions"] = [{
                      "version": app.get("version"),
                      "date": app.get("versionDate"),
                      "localizedDescription": app.get("localizedDescription", "Stable production build."),
                      "downloadURL": app.get("downloadURL"),
                      "size": app.get("size", 120000000)
                  }]
              return app

          local_source_files = list(FILE_CONFIG.keys())

          for filepath in local_source_files:
              if not os.path.exists(filepath):
                  print(f"Notice: Standalone file path not detected in workspace: {filepath}")
                  continue
              try:
                  with open(filepath, "r", encoding="utf-8") as file_in:
                      repo_data = json.load(file_in)

                  icon_name, bundle_id = FILE_CONFIG[filepath]
                  icon_url = f"{bu}/assets/{icon_name}"

                  apps_in_file = repo_data.get("apps", [])
                  app_name = apps_in_file[0].get("name", "Application") if apps_in_file else "Application"

                  repo_data["name"] = f"OmniSource - {app_name}"
                  repo_data["website"] = f"{bu}/"
                  repo_data["description"] = f"Standalone distribution feed for {app_name}, curated within OmniSource."

                  for app_entry in apps_in_file:
                      validated_app = standardize_app_metadata(app_entry, icon_url, bundle_id)
                      master_apps.append(validated_app)

                  if apps_in_file:
                      repo_data["apps"][0]["iconURL"] = icon_url
                      repo_data["iconURL"] = icon_url
                      repo_data["bannerURL"] = banner_icon

                      with open(filepath, "w", encoding="utf-8") as file_out:
                          json.dump(repo_data, file_out, indent=2, ensure_ascii=False)

                  print(f"Successfully compiled and synchronized standalone manifest: {filepath}")
              except Exception as err:
                  print(f"Parsing error encountered on local manifest {filepath}: {err}")

          if master_apps:
              master_feed_payload = {
                  "name": "OmniSource",
                  "identifier": f"com.{so.lower()}.omnisource",
                  "subtitle": "Consolidated iOS Applications & Tweaks Repository",
                  "description": "Master AltStore and SideStore repository compiled and managed under OmniSource.",
                  "iconURL": site_icon,
                  "bannerURL": banner_icon,
                  "website": f"{bu}/",
                  "apps": master_apps
              }
              with open("apps.json", "w", encoding="utf-8") as master_file:
                  json.dump(master_feed_payload, master_file, indent=2, ensure_ascii=False)
              print(f"Master feed successfully generated containing {len(master_apps)} application definitions.")
          else:
              print("Error: Compilation halted. No valid application definitions identified.")
          '

      - name: Commit and Push Repository Updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add apps.json uyouenhanced.json spotiflac.json ytkace.json youpro.json ytlite.json ytkp.json ytmusic.json
          git commit -m "build(omnisource): enforce distinct app naming, asset routing, and master feed compilation [skip ci]" || echo "No repository changes pending commit"
          git push origin HEAD:${{ github.ref_name }}
