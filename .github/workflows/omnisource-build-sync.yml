name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Homebrew & iOS Toolchain Dependencies
        run: |
          brew install ldid dpkg make
          sudo mkdir -p /opt/theos
          sudo chown -R $(id -u):$(id -g) /opt/theos

      - name: Set up Theos Environment
        run: |
          [ ! -d "/opt/theos/.git" ] && git clone --recursive https://github.com/theos/theos.git /opt/theos
          rm -rf /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Feed Sync & Compilation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          THEOS: /opt/theos
        run: |
          python3 -c '
          import json, urllib.request, urllib.error, os, datetime

          so, bu = "iamsmmh", "https://iamsmmh.github.io/OmniSource"
          h = {"User-Agent": "Mozilla/5.0"}
          if t := os.environ.get("GH_TOKEN"): h["Authorization"] = f"token {t}"

          ma = []
          si = f"{bu}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{bu}/assets/icon.png"
          bn = f"{bu}/assets/banner.png" if os.path.exists("assets/banner.png") else si

          def fetch(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h)) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
              return None

          # Part 1: uYouEnhanced via Upstream Feed
          yc = {"json_file": "uyouenhanced.json", "bundleIdentifier": "com.google.ios.youtube", "name": "uYouEnhanced", "developerName": "arichornlover & Various Contributors", "subtitle": "uYou Extended with Modern Fixes & iSponsorBlock", "tintColor": "FF0000", "icon_filename": "uYouEnhanched.png"}
          alt_data = fetch("https://raw.githubusercontent.com/arichornlover/arichornlover.github.io/main/apps.json") or {}
          ta = next((a for a in alt_data.get("apps", []) if "youtube" in a.get("bundleIdentifier", "").lower() or "uyou" in a.get("name", "").lower()), None)

          if ta:
              tag = ta.get("version", "3.0.4")
              pd = ta.get("versionDate", datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
              desc = ta.get("localizedDescription", "uYouEnhanced official community release.")
              ipa = ta.get("downloadURL", "")
              sz = int(ta.get("size", 120000000))
              
              icon_fn = yc["icon_filename"]
              icu = f"{bu}/assets/{icon_fn}" if os.path.exists(f"assets/{icon_fn}") else si
              
              ad = {"name": yc["name"], "bundleIdentifier": yc["bundleIdentifier"], "developerName": yc["developerName"], "subtitle": yc["subtitle"], "localizedDescription": desc, "iconURL": icu, "tintColor": yc["tintColor"], "version": tag, "versionDate": pd, "versionDescription": desc, "downloadURL": ipa, "size": sz, "versions": ta.get("versions", [{"version": tag, "date": pd, "localizedDescription": desc, "downloadURL": ipa, "size": sz}])}
              dev_name = yc["developerName"]
              with open(yc["json_file"], "w", encoding="utf-8") as f:
                  json.dump({"name": "OmniSource - uYouEnhanced", "identifier": f"com.{so.lower()}.omnisource.uyouenhanced", "subtitle": "uYouEnhanced Standalone Feed", "description": f"Standalone source for uYouEnhanced. Developed by {dev_name}. Maintained by {so}.", "iconURL": si, "bannerURL": bn, "website": bu, "apps": [ad]}, f, indent=2, ensure_ascii=False)
              ma.append(ad)

          # Part 2: Remaining Apps via GitHub API
          cfgs = [
              {"repo_owner": "spotiflacapp", "repo_name": "SpotiFLAC-Mobile", "json_file": "spotiflac.json", "bundleIdentifier": "com.zarzet.spotiflac", "name": "SpotiFLAC Mobile", "developerName": "zarzet", "subtitle": "FLAC Downloader for iOS", "tintColor": "1DB954", "icon_url_fallback": "https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Mobile/main/assets/images/logo.png", "asset_keyword": "spotiflac"},
              {"repo_owner": "mrdrvt99", "repo_name": "YouProEXTRA", "json_file": "ytkace.json", "bundleIdentifier": "com.google.ios.youtube", "name": "YTKACE", "developerName": "itzzace", "subtitle": "Open-Source YouTube Enhancer with SponsorBlock", "tintColor": "FF0000", "icon_filename": "YouTube.png", "asset_keyword": "ytkace"},
              {"repo_owner": "mrdrvt99", "repo_name": "YouProEXTRA", "json_file": "youpro.json", "bundleIdentifier": "com.google.ios.youtube", "name": "YouPro", "developerName": "Alibusut", "subtitle": "YouTube Mod with Premium Features & Downloader", "tintColor": "FF0000", "icon_filename": "YouTube.png", "asset_keyword": "youpro"},
              {"repo_owner": "mrdrvt99", "repo_name": "YouProEXTRA", "json_file": "ytlite.json", "bundleIdentifier": "com.google.ios.youtube", "name": "YTLite", "developerName": "Dayanch96", "subtitle": "Lightweight & Highly Customizable YouTube Mod", "tintColor": "FF0000", "icon_filename": "YouTube.png", "asset_keyword": "ytlite"},
              {"repo_owner": "mrdrvt99", "repo_name": "YouProEXTRA", "json_file": "ytkp.json", "bundleIdentifier": "com.google.ios.youtube", "name": "YTKillerPlus", "developerName": "IKillerApp", "subtitle": "All-in-One YouTube Downloader & Tweak Suite", "tintColor": "FF0000", "icon_filename": "YouTube.png", "asset_keyword": "ytkiller"},
              {"repo_owner": "mrdrvt99", "repo_name": "YTMusicUltimate", "json_file": "ytmusic.json", "bundleIdentifier": "com.google.ios.youtubemusic", "name": "YTMusicUltimate", "developerName": "Dayanch96", "subtitle": "YouTube Music with Background Play & No Ads", "tintColor": "FF0000", "icon_filename": "YouTubeMusic.png", "asset_keyword": "ytmusic"}
          ]

          for c in cfgs:
              ro, rn, jf, kw = c["repo_owner"], c["repo_name"], c["json_file"], c.get("asset_keyword", "").lower()
              rel = fetch(f"https://api.github.com/repos/{ro}/{rn}/releases/latest") or next((r for r in (fetch(f"https://api.github.com/repos/{ro}/{rn}/releases") or [])), None)
              if not rel: continue

              tag = rel.get("tag_name", "1.0.0").lstrip("v")
              pd = rel.get("published_at", datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
              c_dev = c["developerName"]
              desc = rel.get("body", f"Official release maintained by {c_dev}.")
              
              assets = rel.get("assets", [])
              matched = next((a for a in assets if (n := a.get("name", "").lower()).endswith((".ipa", ".tipa")) and (not kw or kw in n)), None) or next((a for a in assets if a.get("name", "").lower().endswith((".ipa", ".tipa"))), None)
              if not matched: continue

              ipa, sz = matched.get("browser_download_url", ""), int(matched.get("size", 35967116))
              
              c_icon = c.get("icon_filename", "")
              if "icon_url_fallback" in c:
                  icu = c["icon_url_fallback"]
              elif c_icon and os.path.exists(f"assets/{c_icon}"):
                  icu = f"{bu}/assets/{c_icon}"
              else:
                  icu = si

              cn = c["name"].lower().replace(" ", "")

              ad = {"name": c["name"], "bundleIdentifier": c["bundleIdentifier"], "developerName": c["developerName"], "subtitle": c["subtitle"], "localizedDescription": desc, "iconURL": icu, "tintColor": c["tintColor"], "version": tag, "versionDate": pd, "versionDescription": desc, "downloadURL": ipa, "size": sz, "versions": [{"version": tag, "date": pd, "localizedDescription": desc, "downloadURL": ipa, "size": sz}]}
              c_name = c["name"]
              with open(jf, "w", encoding="utf-8") as f:
                  json.dump({"name": f"OmniSource - {c_name}", "identifier": f"com.{so.lower()}.omnisource.{cn}", "subtitle": f"{c_name} Standalone Feed", "description": f"Standalone source for {c_name}. Developed by {c_dev}. Maintained by {so}.", "iconURL": si, "bannerURL": bn, "website": bu, "apps": [ad]}, f, indent=2, ensure_ascii=False)
              ma.append(ad)

          if ma:
              with open("apps.json", "w", encoding="utf-8") as f:
                  json.dump({"name": "OmniSource", "identifier": f"com.{so.lower()}.omnisource", "subtitle": "Consolidated iOS Applications & Tweaks Repository", "description": f"Master AltStore / SideStore source curated by {so}. Full credit to original developers.", "iconURL": si, "bannerURL": bn, "website": bu, "apps": ma}, f, indent=2, ensure_ascii=False)
          '

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "chore(feed): configure OmniSource.png as source icon [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
