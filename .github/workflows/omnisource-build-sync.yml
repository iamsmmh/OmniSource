name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: omnisource-build-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync With Remote Before Build
        run: git pull origin ${{ github.ref_name }} --rebase || echo "No rebase needed"

      - name: Execute Feed Compilation & Asset Routing Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 <<'PYEOF'
          import json, os, sys, datetime, glob, urllib.request, urllib.error

          SOURCE_OWNER = "iamsmmh"
          BASE_URL = "https://iamsmmh.github.io/OmniSource"

          site_icon = f"{BASE_URL}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{BASE_URL}/assets/icon.png"
          banner_icon = f"{BASE_URL}/assets/banner.png" if os.path.exists("assets/banner.png") else site_icon

          # filename (lowercase, as expected) -> (icon filename, bundle id, developer name)
          FILE_CONFIG = {
              "uyouenhanced.json": ("uYouEnhanced.png", "com.google.ios.youtube",      "arichornlover"),
              "spotiflac.json":    ("SpotiFLAC.png",    "com.zarzet.spotiflac",        "Zarzet"),
              "ytkace.json":       ("YouTube.png",      "com.google.ios.youtube",      "itzzace"),
              "youpro.json":       ("YouTube.png",      "com.google.ios.youtube",      "alibusut"),
              "ytlite.json":       ("YouTube.png",      "com.google.ios.youtube",      "dayanch96"),
              "ytkp.json":         ("YouTube.png",      "com.google.ios.youtube",      "ikghd"),
              "ytmusic.json":      ("YouTubeMusic.png", "com.google.ios.youtubemusic", "dayanch96"),
          }

          def check_url_alive(url, timeout=10):
              """Returns True if the URL responds successfully to a HEAD (falls back to GET)."""
              if not url:
                  return False
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return 200 <= resp.status < 400
              except urllib.error.HTTPError as e:
                  if e.code == 405:  # some hosts reject HEAD, retry with GET
                      try:
                          req2 = urllib.request.Request(url, method="GET")
                          with urllib.request.urlopen(req2, timeout=timeout) as resp2:
                              return 200 <= resp2.status < 400
                      except Exception:
                          return False
                  return False
              except Exception:
                  return False

          # --- Diagnostic: show exactly what JSON files actually exist in repo root ---
          actual_files = sorted(glob.glob("*.json"))
          print("::group::Repo root JSON files detected")
          for f in actual_files:
              print(f"  - {f}")
          print("::endgroup::")

          actual_files_lower = {f.lower(): f for f in actual_files}

          def standardize_app_metadata(app, icon_url, bundle_id, developer_name):
              app["bundleIdentifier"] = bundle_id
              app["iconURL"] = icon_url
              app["developerName"] = developer_name

              if not app.get("versionDate"):
                  app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                  app["versions"] = [{
                      "version": app.get("version"),
                      "date": app.get("versionDate"),
                      "localizedDescription": app.get("localizedDescription", "Stable production build."),
                      "downloadURL": app.get("downloadURL"),
                      "size": app.get("size", 120000000)
                  }]
              return app

          master_apps = []
          had_errors = False
          skipped_dead_links = []

          for expected_name, (icon_name, bundle_id, developer_name) in FILE_CONFIG.items():
              real_filepath = actual_files_lower.get(expected_name.lower())

              if real_filepath is None:
                  print(f"::error::Expected '{expected_name}' not found in repo root. "
                        f"Files present: {actual_files}. Check for typos, casing, or subfolder placement.")
                  had_errors = True
                  continue

              if real_filepath != expected_name:
                  print(f"::warning::Matched '{expected_name}' to on-disk file '{real_filepath}' "
                        f"(case mismatch) — consider renaming for consistency.")

              try:
                  with open(real_filepath, "r", encoding="utf-8") as f:
                      repo_data = json.load(f)
              except (json.JSONDecodeError, OSError) as err:
                  print(f"::error::Failed to parse {real_filepath}: {err}")
                  had_errors = True
                  continue

              apps_in_file = repo_data.get("apps", [])
              if not apps_in_file:
                  print(f"::error::'{real_filepath}' has no valid 'apps' array (found keys: {list(repo_data.keys())}).")
                  had_errors = True
                  continue

              app_name = apps_in_file[0].get("name", "Application")
              icon_url = f"{BASE_URL}/assets/{icon_name}"

              repo_data["name"] = f"OmniSource - {app_name}"
              repo_data["website"] = f"{BASE_URL}/"
              repo_data["description"] = f"Standalone distribution feed for {app_name}, curated within OmniSource."
              repo_data["iconURL"] = icon_url
              repo_data["bannerURL"] = banner_icon

              kept_apps = []
              for app_entry in apps_in_file:
                  dl_url = app_entry.get("downloadURL", "")
                  print(f"Checking download link for '{app_entry.get('name', app_name)}'...")
                  if check_url_alive(dl_url):
                      print(f"  ✓ Link OK: {dl_url}")
                      kept_apps.append(standardize_app_metadata(app_entry, icon_url, bundle_id, developer_name))
                  else:
                      print(f"::warning::Dead or unreachable downloadURL for '{app_entry.get('name', app_name)}' "
                            f"in {real_filepath}: {dl_url} — excluding from feed.")
                      skipped_dead_links.append(f"{real_filepath} -> {app_entry.get('name', app_name)}")

              if not kept_apps:
                  print(f"::warning::All apps in '{real_filepath}' had dead links — file will not appear in feed this run.")
                  continue

              repo_data["apps"] = kept_apps
              master_apps.extend(kept_apps)

              try:
                  with open(real_filepath, "w", encoding="utf-8") as f:
                      json.dump(repo_data, f, indent=2, ensure_ascii=False)
                  print(f"Synchronized: {real_filepath} ({len(kept_apps)} app(s) with live links)")
              except OSError as err:
                  print(f"::error::Failed to write {real_filepath}: {err}")
                  had_errors = True

          if not master_apps:
              print("::error::No valid application definitions identified. Aborting master feed write.")
              sys.exit(1)

          master_feed_payload = {
              "name": "OmniSource",
              "identifier": f"com.{SOURCE_OWNER.lower()}.omnisource",
              "subtitle": "Consolidated iOS Applications & Tweaks Repository",
              "description": "Master AltStore and SideStore repository compiled and managed under OmniSource.",
              "iconURL": site_icon,
              "bannerURL": banner_icon,
              "website": f"{BASE_URL}/",
              "apps": master_apps
          }

          with open("apps.json", "w", encoding="utf-8") as f:
              json.dump(master_feed_payload, f, indent=2, ensure_ascii=False)

          print(f"Master feed generated with {len(master_apps)} app definitions (expected up to 7).")

          if skipped_dead_links:
              print("::warning::Apps excluded this run due to dead links:")
              for item in skipped_dead_links:
                  print(f"  - {item}")

          if had_errors:
              print("::error::Completed with structural errors — see annotations above.")
              sys.exit(1)
          PYEOF

      - name: Commit and Push Repository Updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          FILES="apps.json uyouenhanced.json spotiflac.json ytkace.json youpro.json ytlite.json ytkp.json ytmusic.json"

          for f in $FILES; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build(omnisource): sync app naming, asset routing, developer attribution, link validation, and master feed [skip ci]"

          git pull origin ${{ github.ref_name }} --rebase
          git push origin HEAD:${{ github.ref_name }}
