name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: omnisource-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Identity & Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed"

      - name: Run OmniSource Sync & Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 scripts/omnisource.py

      - name: Commit and Push
        run: |
          FILES="apps.json spotiflac.json youmod.json youpro.json ytkace.json ytkp.json ytlite.json ytmusic.json"
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "chore(omnisource): sync releases and rebuild feed [skip ci]"
          git pull origin main --rebase
          git push origin HEAD:main
