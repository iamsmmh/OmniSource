name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: omnisource-build-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync With Remote Before Build
        run: git pull origin ${{ github.ref_name }} --rebase || echo "No rebase needed"

      - name: Execute Feed Compilation & Asset Routing Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 <<'PYEOF'
          import json, os, sys, datetime

          SOURCE_OWNER = "iamsmmh"
          BASE_URL = "https://iamsmmh.github.io/OmniSource"

          site_icon = f"{BASE_URL}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{BASE_URL}/assets/icon.png"
          banner_icon = f"{BASE_URL}/assets/banner.png" if os.path.exists("assets/banner.png") else site_icon

          # Explicit per-file config: filename -> (icon filename, bundle id)
          FILE_CONFIG = {
              "uyouenhanced.json": ("uYouEnhanced.png", "com.google.ios.youtube"),
              "spotiflac.json":    ("SpotiFLAC.png",    "com.zarzet.spotiflac"),
              "ytkace.json":       ("YouTube.png",      "com.google.ios.youtube"),
              "youpro.json":       ("YouTube.png",      "com.google.ios.youtube"),
              "ytlite.json":       ("YouTube.png",      "com.google.ios.youtube"),
              "ytkp.json":         ("YouTube.png",      "com.google.ios.youtube"),
              "ytmusic.json":      ("YouTubeMusic.png", "com.google.ios.youtubemusic"),
          }

          def standardize_app_metadata(app, icon_url, bundle_id):
              app["bundleIdentifier"] = bundle_id
              app["iconURL"] = icon_url

              if not app.get("versionDate"):
                  app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                  app["versions"] = [{
                      "version": app.get("version"),
                      "date": app.get("versionDate"),
                      "localizedDescription": app.get("localizedDescription", "Stable production build."),
                      "downloadURL": app.get("downloadURL"),
                      "size": app.get("size", 120000000)
                  }]
              return app

          master_apps = []
          changed_files = []
          had_errors = False

          for filepath, (icon_name, bundle_id) in FILE_CONFIG.items():
              if not os.path.exists(filepath):
                  print(f"::warning::Source file not found, skipping: {filepath}")
                  continue

              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      repo_data = json.load(f)
              except (json.JSONDecodeError, OSError) as err:
                  print(f"::error::Failed to parse {filepath}: {err}")
                  had_errors = True
                  continue

              apps_in_file = repo_data.get("apps", [])
              if not apps_in_file:
                  print(f"::warning::No apps array found in {filepath}, skipping")
                  continue

              app_name = apps_in_file[0].get("name", "Application")
              icon_url = f"{BASE_URL}/assets/{icon_name}"

              repo_data["name"] = f"OmniSource - {app_name}"
              repo_data["website"] = f"{BASE_URL}/"
              repo_data["description"] = f"Standalone distribution feed for {app_name}, curated within OmniSource."
              repo_data["iconURL"] = icon_url
              repo_data["bannerURL"] = banner_icon

              for app_entry in apps_in_file:
                  master_apps.append(standardize_app_metadata(app_entry, icon_url, bundle_id))

              try:
                  with open(filepath, "w", encoding="utf-8") as f:
                      json.dump(repo_data, f, indent=2, ensure_ascii=False)
                  changed_files.append(filepath)
                  print(f"Synchronized: {filepath}")
              except OSError as err:
                  print(f"::error::Failed to write {filepath}: {err}")
                  had_errors = True

          if not master_apps:
              print("::error::No valid application definitions identified. Aborting master feed write.")
              sys.exit(1)

          master_feed_payload = {
              "name": "OmniSource",
              "identifier": f"com.{SOURCE_OWNER.lower()}.omnisource",
              "subtitle": "Consolidated iOS Applications & Tweaks Repository",
              "description": "Master AltStore and SideStore repository compiled and managed under OmniSource.",
              "iconURL": site_icon,
              "bannerURL": banner_icon,
              "website": f"{BASE_URL}/",
              "apps": master_apps
          }

          with open("apps.json", "w", encoding="utf-8") as f:
              json.dump(master_feed_payload, f, indent=2, ensure_ascii=False)

          print(f"Master feed generated with {len(master_apps)} app definitions.")

          if had_errors:
              print("::warning::Completed with one or more non-fatal errors — check log above.")
          PYEOF

      - name: Commit and Push Repository Updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          FILES="apps.json uyouenhanced.json spotiflac.json ytkace.json youpro.json ytlite.json ytkp.json ytmusic.json"

          for f in $FILES; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build(omnisource): sync app naming, asset routing, and master feed [skip ci]"

          # Re-sync in case remote moved during the build step, then push
          git pull origin ${{ github.ref_name }} --rebase
          git push origin HEAD:${{ github.ref_name }}
