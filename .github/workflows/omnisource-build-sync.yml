name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: omnisource-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Identity & Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Run OmniSource Sync & Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/omnisource.py

      - name: Validate JSON Feeds
        run: python3 scripts/validate_feeds.py

      - name: Commit and Push
        run: |
          git add -- '*.json'

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore(omnisource): sync releases and rebuild feed [skip ci]"
          git push origin HEAD:main
