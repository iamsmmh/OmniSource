name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: omnisource-build-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Fetch Upstream Releases, Validate, and Build Master Feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync With Remote Before Build
        run: git pull origin main --rebase || echo "No rebase needed"

      # ---------------------------------------------------------------
      # STAGE 1: Pull latest upstream releases into individual manifests
      # ---------------------------------------------------------------
      - name: Fetch YouProEXTRA Latest Releases (youpro, ytkp, youmod, ytkace, ytlite)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          SOURCE_REPO = 'mrdrvt99/YouProEXTRA'
          GH_TOKEN    = os.environ.get('GH_TOKEN', '')

          TAG_MAP = {
              'youmod-ipa':      'youmod',
              'youproextra-ipa': 'youpro',
              'ytkp-ipa':        'ytkp',
              'ytkace-ipa':      'ytkace',
          }

          FILES = {
              'ytkp':   'ytkp.json',
              'youpro': 'youpro.json',
              'youmod': 'youmod.json',
              'ytkace': 'ytkace.json',
          }

          YTLITE_TAG_PREFIX = 'ytl-ipa'
          YTLITE_FILE       = 'ytlite.json'

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/omnisource-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = getattr(e, 'reason', str(e))
                  code = getattr(e, 'code', 'N/A')
                  print(f"::error::API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          def fetch_all_releases(repo, max_pages=10):
              results = []
              for page in range(1, max_pages + 1):
                  batch = fetch_json(f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}')
                  if not batch:
                      break
                  results.extend(batch)
                  if len(batch) < 100:
                      break
              return results

          all_releases = fetch_all_releases(SOURCE_REPO)
          published = [r for r in all_releases if not r['draft'] and not r['prerelease']]
          ytlite_candidates = [r for r in all_releases if not r['draft']]

          best = {}
          ytlite_releases = [r for r in ytlite_candidates if r['tag_name'].startswith(YTLITE_TAG_PREFIX)]

          for release in published:
              tag = release['tag_name']
              if tag.startswith('youproextra-noytlite-ipa') or tag.startswith(YTLITE_TAG_PREFIX):
                  continue
              for prefix, key in TAG_MAP.items():
                  if tag.startswith(prefix) and key not in best:
                      best[key] = release
                      break

          if not best and not ytlite_releases:
              print("::warning::No matching YouProEXTRA releases found.")

          if ytlite_releases:
              print(f"Found {len(ytlite_releases)} ytl-ipa release(s): {sorted(r['tag_name'] for r in ytlite_releases)}")

          for app_key, release in best.items():
              tag          = release['tag_name']
              published_at = release.get('published_at', '')
              date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
              release_body = (release.get('body') or '').strip()

              ipa_asset = next((a for a in release.get('assets', []) if a['name'].endswith('.ipa')), None)
              if not ipa_asset:
                  print(f"::warning::No .ipa asset for {tag} — skipping.")
                  continue

              download_url = ipa_asset['browser_download_url']
              size         = ipa_asset['size']
              ipa_name     = ipa_asset['name']
              filename     = FILES[app_key]

              if not os.path.exists(filename):
                  print(f"::error::Expected manifest '{filename}' not found in repo root — skipping update.")
                  continue

              with open(filename, 'r', encoding='utf-8') as f:
                  source = json.load(f)

              apps_list = source.get('apps', [])
              if not apps_list:
                  print(f"::error::'{filename}' has no 'apps' array — skipping update.")
                  continue
              app = apps_list[0]

              if app.get('downloadURL') == download_url:
                  print(f"{filename} already up to date.")
                  continue

              matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
              if not matches:
                  print(f"::warning::Could not parse version from '{ipa_name}' — skipping {filename}.")
                  continue
              yt_version = matches[0]

              ipa_label   = ipa_name.replace('.ipa', '')
              description = f"YouTube {yt_version} | {ipa_label}" + (f"\n\n{release_body}" if release_body else "")

              new_entry = {
                  "version": yt_version, "date": date_str, "localizedDescription": description,
                  "downloadURL": download_url, "size": size, "minOSVersion": "16.0"
              }
              app['versions']           = [new_entry]
              app['version']            = yt_version
              app['versionDate']        = date_str
              app['versionDescription'] = description
              app['downloadURL']        = download_url
              app['size']               = size

              with open(filename, 'w', encoding='utf-8') as f:
                  json.dump(source, f, indent=2, ensure_ascii=False)
                  f.write('\n')

              print(f"Updated {filename}: '{app.get('name')}' → YouTube {yt_version} ({tag})")

          if ytlite_releases:
              def ytlite_tag_num(release):
                  m = re.search(r'ytl-ipa(\d+)', release['tag_name'])
                  return int(m.group(1)) if m else -1

              YTLITE_MIN_OS = {0: "14.0", 1: "15.0"}
              YTLITE_MIN_OS_DEFAULT = "16.0"

              ytlite_releases.sort(key=ytlite_tag_num, reverse=True)
              entries = []
              for release in ytlite_releases:
                  tag_num      = ytlite_tag_num(release)
                  min_os       = YTLITE_MIN_OS.get(tag_num, YTLITE_MIN_OS_DEFAULT)
                  published_at = release.get('published_at', '')
                  date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
                  release_body = (release.get('body') or '').strip()

                  ipa_asset = next((a for a in release.get('assets', []) if a['name'].endswith('.ipa')), None)
                  if not ipa_asset:
                      print(f"::warning::No .ipa asset for {release['tag_name']} — skipping.")
                      continue

                  download_url = ipa_asset['browser_download_url']
                  size         = ipa_asset['size']
                  ipa_name     = ipa_asset['name']

                  matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
                  if not matches:
                      print(f"::warning::Could not parse version from '{ipa_name}' — skipping.")
                      continue
                  yt_version = matches[0]
                  ipa_label   = ipa_name.replace('.ipa', '')
                  description = f"YouTube {yt_version} | {ipa_label}" + (f"\n\n{release_body}" if release_body else "")

                  entries.append({
                      "version": yt_version, "date": date_str, "localizedDescription": description,
                      "downloadURL": download_url, "size": size, "minOSVersion": min_os,
                  })

              if not entries:
                  print("::warning::No usable ytl-ipa releases found — skipping ytlite.json.")
              elif not os.path.exists(YTLITE_FILE):
                  print(f"::error::Expected manifest '{YTLITE_FILE}' not found in repo root.")
              else:
                  with open(YTLITE_FILE, 'r', encoding='utf-8') as f:
                      ytlite_source = json.load(f)

                  ytlite_apps = ytlite_source.get('apps', [])
                  if not ytlite_apps:
                      print(f"::error::'{YTLITE_FILE}' has no 'apps' array.")
                  else:
                      ytlite_app = ytlite_apps[0]
                      existing_urls = [v.get('downloadURL') for v in ytlite_app.get('versions', [])]
                      new_urls      = [e['downloadURL'] for e in entries]

                      if existing_urls == new_urls:
                          print(f"{YTLITE_FILE} already up to date ({len(entries)} versions).")
                      else:
                          newest = entries[0]
                          ytlite_app['versions']           = entries
                          ytlite_app['version']            = newest['version']
                          ytlite_app['versionDate']        = newest['date']
                          ytlite_app['versionDescription'] = newest['localizedDescription']
                          ytlite_app['downloadURL']        = newest['downloadURL']
                          ytlite_app['size']               = newest['size']

                          with open(YTLITE_FILE, 'w', encoding='utf-8') as f:
                              json.dump(ytlite_source, f, indent=2, ensure_ascii=False)
                              f.write('\n')

                          print(f"Updated {YTLITE_FILE}: {len(entries)} versions kept (newest: YouTube {newest['version']})")
          PYEOF

      - name: Fetch YTMusicUltimate Latest Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          YTM_SOURCE_REPO = 'mrdrvt99/YTMusicUltimate'
          GH_TOKEN        = os.environ.get('GH_TOKEN', '')

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/omnisource-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = getattr(e, 'reason', str(e))
                  code = getattr(e, 'code', 'N/A')
                  print(f"::error::YTMusic API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          if not os.path.exists('ytmusic.json'):
              print("::error::'ytmusic.json' not found in repo root — skipping.")
              sys.exit(0)

          releases = fetch_json(f'https://api.github.com/repos/{YTM_SOURCE_REPO}/releases?per_page=5')
          release = next((r for r in releases if not r['draft'] and not r['prerelease']), None)
          if release is None:
              print("::warning::No published YTMusicUltimate release found — skipping.")
              sys.exit(0)

          ipa_asset = next((a for a in release.get('assets', []) if a['name'].endswith('.ipa')), None)
          if not ipa_asset:
              print("::warning::No .ipa asset found for YTMusicUltimate — skipping.")
              sys.exit(0)

          download_url = ipa_asset['browser_download_url']
          size         = ipa_asset['size']
          ipa_name     = ipa_asset['name']
          published_at = release.get('published_at', '')
          date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
          release_body = (release.get('body') or '').strip()
          tag          = release['tag_name']

          with open('ytmusic.json', 'r', encoding='utf-8') as f:
              ytm_data = json.load(f)

          apps_list = ytm_data.get('apps', [])
          if not apps_list:
              print("::error::'ytmusic.json' has no 'apps' array.")
              sys.exit(0)
          ytm_app = apps_list[0]

          if ytm_app.get('downloadURL') == download_url:
              print(f"ytmusic.json already up to date: {download_url}")
              sys.exit(0)

          matches = re.findall(r'(\d+\.\d+(?:\.\d+)?)', ipa_name)
          if len(matches) >= 2:
              tweak_version, ytm_version = matches[0], matches[-1]
          elif len(matches) == 1:
              tweak_version = ytm_version = matches[0]
          else:
              tweak_version = ytm_version = tag.lstrip('v')

          ipa_label   = ipa_name.replace('.ipa', '')
          description = f"YTMusicUltimate {tweak_version} | YTMusic {ytm_version} | {ipa_label}"
          if release_body:
              description += f"\n\n{release_body}"

          new_entry = {
              "version": tweak_version, "date": date_str, "localizedDescription": description,
              "downloadURL": download_url, "size": size, "minOSVersion": "16.0"
          }
          ytm_app['versions']           = [new_entry]
          ytm_app['version']            = tweak_version
          ytm_app['versionDate']        = date_str
          ytm_app['versionDescription'] = description
          ytm_app['downloadURL']        = download_url
          ytm_app['size']               = size

          with open('ytmusic.json', 'w', encoding='utf-8') as f:
              json.dump(ytm_data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f"ytmusic.json updated: YTMusicUltimate {tweak_version} → YTMusic {ytm_version} ({tag})")
          PYEOF

      # ---------------------------------------------------------------
      # STAGE 2: Compile all manifests into the master feed
      # ---------------------------------------------------------------
      - name: Execute Feed Compilation, Asset Routing & Link Validation
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, datetime, glob, urllib.request, urllib.error

          SOURCE_OWNER = "iamsmmh"
          BASE_URL = "https://iamsmmh.github.io/OmniSource"

          site_icon   = f"{BASE_URL}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{BASE_URL}/assets/icon.png"
          banner_icon = f"{BASE_URL}/assets/banner.png" if os.path.exists("assets/banner.png") else site_icon

          # filename (lowercase) -> (icon filename, bundle id, developer name)
          FILE_CONFIG = {
              "uyouenhanced.json": ("uYouEnhanced.png", "com.google.ios.youtube",      "arichornlover"),
              "spotiflac.json":    ("SpotiFLAC.png",    "com.zarzet.spotiflac",        "Zarzet"),
              "ytkace.json":       ("YouTube.png",      "com.google.ios.youtube",      "itzzace"),
              "youpro.json":       ("YouTube.png",      "com.google.ios.youtube",      "alibusut"),
              "ytlite.json":       ("YouTube.png",      "com.google.ios.youtube",      "dayanch96"),
              "ytkp.json":         ("YouTube.png",      "com.google.ios.youtube",      "ikghd"),
              "ytmusic.json":      ("YouTubeMusic.png", "com.google.ios.youtubemusic", "dayanch96"),
              "youmod.json":       ("YouTube.png",      "com.google.ios.youtube",      "Tonwalter888"),
          }

          def check_url_alive(url, timeout=10):
              if not url:
                  return False
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return 200 <= resp.status < 400
              except urllib.error.HTTPError as e:
                  if e.code == 405:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url, method="GET"), timeout=timeout) as resp2:
                              return 200 <= resp2.status < 400
                      except Exception:
                          return False
                  return False
              except Exception:
                  return False

          actual_files = sorted(glob.glob("*.json"))
          print("::group::Repo root JSON files detected")
          for f in actual_files:
              print(f"  - {f}")
          print("::endgroup::")
          actual_files_lower = {f.lower(): f for f in actual_files}

          def standardize_app_metadata(app, icon_url, bundle_id, developer_name):
              app["bundleIdentifier"] = bundle_id
              app["iconURL"] = icon_url
              app["developerName"] = developer_name
              if not app.get("versionDate"):
                  app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                  app["versions"] = [{
                      "version": app.get("version"), "date": app.get("versionDate"),
                      "localizedDescription": app.get("localizedDescription", "Stable production build."),
                      "downloadURL": app.get("downloadURL"), "size": app.get("size", 120000000)
                  }]
              return app

          master_apps = []
          had_errors = False
          skipped_dead_links = []

          for expected_name, (icon_name, bundle_id, developer_name) in FILE_CONFIG.items():
              real_filepath = actual_files_lower.get(expected_name.lower())

              if real_filepath is None:
                  print(f"::error::Expected '{expected_name}' not found. Files present: {actual_files}")
                  had_errors = True
                  continue

              if real_filepath != expected_name:
                  print(f"::warning::Matched '{expected_name}' to on-disk file '{real_filepath}' (case mismatch).")

              try:
                  with open(real_filepath, "r", encoding="utf-8") as f:
                      repo_data = json.load(f)
              except (json.JSONDecodeError, OSError) as err:
                  print(f"::error::Failed to parse {real_filepath}: {err}")
                  had_errors = True
                  continue

              apps_in_file = repo_data.get("apps", [])
              if not apps_in_file:
                  print(f"::error::'{real_filepath}' has no valid 'apps' array (keys: {list(repo_data.keys())}).")
                  had_errors = True
                  continue

              app_name = apps_in_file[0].get("name", "Application")
              icon_url = f"{BASE_URL}/assets/{icon_name}"

              repo_data["name"] = f"OmniSource - {app_name}"
              repo_data["website"] = f"{BASE_URL}/"
              repo_data["description"] = f"Standalone distribution feed for {app_name}, curated within OmniSource."
              repo_data["iconURL"] = icon_url
              repo_data["bannerURL"] = banner_icon

              kept_apps = []
              for app_entry in apps_in_file:
                  dl_url = app_entry.get("downloadURL", "")
                  print(f"Checking download link for '{app_entry.get('name', app_name)}'...")
                  if check_url_alive(dl_url):
                      print(f"  OK: {dl_url}")
                      kept_apps.append(standardize_app_metadata(app_entry, icon_url, bundle_id, developer_name))
                  else:
                      print(f"::warning::Dead/unreachable downloadURL for '{app_entry.get('name', app_name)}' in {real_filepath}: {dl_url}")
                      skipped_dead_links.append(f"{real_filepath} -> {app_entry.get('name', app_name)}")

              if not kept_apps:
                  print(f"::warning::All apps in '{real_filepath}' had dead links — excluded this run.")
                  continue

              repo_data["apps"] = kept_apps
              master_apps.extend(kept_apps)

              try:
                  with open(real_filepath, "w", encoding="utf-8") as f:
                      json.dump(repo_data, f, indent=2, ensure_ascii=False)
                  print(f"Synchronized: {real_filepath} ({len(kept_apps)} app(s))")
              except OSError as err:
                  print(f"::error::Failed to write {real_filepath}: {err}")
                  had_errors = True

          if not master_apps:
              print("::error::No valid application definitions identified. Aborting.")
              sys.exit(1)

          master_feed_payload = {
              "name": "OmniSource",
              "identifier": f"com.{SOURCE_OWNER.lower()}.omnisource",
              "subtitle": "Consolidated iOS Applications & Tweaks Repository",
              "description": "Master AltStore and SideStore repository compiled and managed under OmniSource.",
              "iconURL": site_icon,
              "bannerURL": banner_icon,
              "website": f"{BASE_URL}/",
              "apps": master_apps
          }

          with open("apps.json", "w", encoding="utf-8") as f:
              json.dump(master_feed_payload, f, indent=2, ensure_ascii=False)

          print(f"Master feed generated with {len(master_apps)} app definitions (expected up to {len(FILE_CONFIG)}).")

          if skipped_dead_links:
              print("::warning::Apps excluded this run due to dead links:")
              for item in skipped_dead_links:
                  print(f"  - {item}")

          if had_errors:
              print("::error::Completed with structural errors — see annotations above.")
              sys.exit(1)
          PYEOF

      # ---------------------------------------------------------------
      # STAGE 3: Single commit/push for everything changed
      # ---------------------------------------------------------------
      - name: Commit and Push All Updates
        run: |
          FILES="apps.json spotiflac.json uyouenhanced.json youmod.json youpro.json ytkace.json ytkp.json ytlite.json ytmusic.json"

          for f in $FILES; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore(omnisource): sync upstream releases, asset routing, developer attribution, and master feed [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
          fi
