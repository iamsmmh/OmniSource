name: OmniSource Build & Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Robust Local Feed Verification & Master Compilation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 -c '
          import json, os, datetime

          so, bu = "iamsmmh", "https://iamsmmh.github.io/OmniSource"
          ma = []
          si = f"{bu}/assets/OmniSource.png" if os.path.exists("assets/OmniSource.png") else f"{bu}/assets/icon.png"
          bn = f"{bu}/assets/banner.png" if os.path.exists("assets/banner.png") else si

          # List of local standalone JSON files managed in your repository
          local_files = [
              "uyouenhanced.json", 
              "spotiflac.json", 
              "ytkace.json", 
              "youpro.json", 
              "ytlite.json", 
              "ytkp.json", 
              "ytmusic.json"
          ]

          for jf in local_files:
              if os.path.exists(jf):
                  try:
                      with open(jf, "r", encoding="utf-8") as f:
                          data = json.load(f)
                      
                      apps = data.get("apps", [])
                      for app in apps:
                          name_lower = app.get("name", "").lower()
                          id_lower = app.get("bundleIdentifier", "").lower()

                          # Enforce proper official/unique bundle alignment based on user preference
                          if "music" in name_lower or "youtubemusic" in id_lower:
                              app["bundleIdentifier"] = "com.google.ios.youtubemusic"
                          elif "spotiflac" in name_lower or "zarzet" in id_lower:
                              app["bundleIdentifier"] = "com.zarzet.spotiflac"
                          else:
                              # Standard YouTube variant default
                              app["bundleIdentifier"] = "com.google.ios.youtube"

                          # Validate essential AltStore/SideStore keys to prevent client parsing errors
                          if not app.get("versionDate"):
                              app["versionDate"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                          if not app.get("versions") and app.get("version") and app.get("downloadURL"):
                              app["versions"] = [{
                                  "version": app.get("version"),
                                  "date": app.get("versionDate"),
                                  "localizedDescription": app.get("localizedDescription", "Stable release."),
                                  "downloadURL": app.get("downloadURL"),
                                  "size": app.get("size", 120000000)
                              }]

                          ma.append(app)
                      print(f"Successfully validated and loaded entries from: {jf}")
                  except Exception as e:
                      print(f"Malformed JSON syntax or read error in {jf}: {e}")
              else:
                  print(f"Warning: Standalone file not found in repo root: {jf}")

          # Build and write clean master apps.json feed
          if ma:
              master_data = {
                  "name": "OmniSource",
                  "identifier": f"com.{so.lower()}.omnisource",
                  "subtitle": "Consolidated iOS Applications & Tweaks Repository",
                  "description": f"Master AltStore / SideStore source curated by {so}.",
                  "iconURL": si,
                  "bannerURL": bn,
                  "website": bu,
                  "apps": ma
              }
              with open("apps.json", "w", encoding="utf-8") as f:
                  json.dump(master_data, f, indent=2, ensure_ascii=False)
              print("Master apps.json compiled successfully with zero syntax gaps.")
          else:
              print("Error: No valid application configurations discovered across local JSON files.")
          '

      - name: Commit and Push Feed Updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json *.json
          git commit -m "fix(feed): validate syntax structures and compile clean master apps.json [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
