name: Reset

on:
  workflow_dispatch:

jobs:
  reset:
    name: Reset JSON files - Keep only latest version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Reset all JSON files (keep only latest version)
        run: |
          files=("apps.json" "ytlite.json" "ytkp.json" "youpro.json" "youmod.json" "ytmusic.json")
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "🔄 Processing $file ..."
              
              # Safe jq: keep full file structure, only trim .versions array to latest entry (if exists)
              jq '
                if .apps then
                  .apps |= map(
                    if (.versions // [] | length > 1) then
                      .versions |= [.[0]]
                    else
                      .
                    end
                  )
                else
                  .
                end
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
              
              echo "✅ Reset $file"
            else
              echo "⚠️  $file not found - skipped"
            fi
          done

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps.json ytlite.json ytkp.json youpro.json youmod.json ytmusic.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: reset JSON files to latest version only"
            git push
          fi
