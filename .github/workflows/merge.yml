# -----------------------------------------------------------------------------
# Merge modular feeds into the unified feeds/apps.json.
#
# feeds/ is the single source of truth for distribution. This workflow rebuilds
# the aggregate document from per-app feeds whenever feeds/*.json changes, then
# re-validates the result. It is the safety net for direct edits and hotfixes;
# the full sync pipeline produces the same output on its own schedule.
#
# Two jobs, two privileges:
#   * `verify` runs on every trigger (including pull_request) with a read-only
#     token and no persisted credentials. It executes the checkout's own
#     scripts, which is exactly why it must never hold write scope: a pull
#     request can rewrite those scripts.
#   * `commit` runs only for pushes to main, re-runs the same scripts with the
#     write token, and commits the merge result.
# -----------------------------------------------------------------------------
name: Merge Feeds

on:
  pull_request:
    paths:
      - "feeds/*.json"
  push:
    branches: [main]
    paths:
      - "feeds/*.json"
  workflow_dispatch:

concurrency:
  group: merge-feeds
  cancel-in-progress: false

# Read-only by default; the commit job opts into exactly what it needs.
permissions:
  contents: read

jobs:
  verify:
    name: Rebuild and validate apps.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # The tree may contain PR-authored scripts; never hand them a token.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge modular feeds into apps.json
        run: python3 scripts/merge_feeds.py

      # The historical flat URL (the installable source, /apps.json) and the
      # /api/ mirror are committed copies of feeds/: GitHub Pages serves this
      # branch, so they must be refreshed whenever the master feed changes.
      - name: Publish repository-root URLs
        run: python3 scripts/publish_root.py

      # Test gate: the commit job below only runs after this job is green.
      # Same suite validate.yml requires on PRs.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate merged feeds
        run: |
          python3 scripts/validate.py
          bash scripts/validate_jq.sh

      # A rebuild from committed state must be a no-op: a hand-edited feed
      # drifts and fails here instead of being published to main.
      - name: Verify generated artifacts are reproducible
        run: python3 scripts/check_reproducible.py

  commit:
    name: Commit merged apps.json
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The verification job ran the very same scripts against the very same
      # commit; here they only produce the files that get committed.
      - name: Merge modular feeds into apps.json
        run: python3 scripts/merge_feeds.py

      - name: Publish repository-root URLs
        run: python3 scripts/publish_root.py

      - name: Commit merged apps.json
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/apps.json apps.json api/apps.json api/apps api/apps.json.gz api/apps.gz

          if git diff --cached --quiet; then
            echo "apps.json already matches feeds/."
            exit 0
          fi

          git commit -m "chore(feeds): merge modular feeds into apps.json [skip ci]"
          # Rebase instead of force-push: a concurrent human commit must survive.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
