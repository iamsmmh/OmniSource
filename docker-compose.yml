services:
  redis:
    image: redis:7-alpine
    container_name: omnisource-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    container_name: omnisource-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OMNISOURCE_REDIS_URL: redis://redis:6379/0
      OMNISOURCE_CACHE_ENABLED: "true"
      OMNISOURCE_CACHE_TTL: "300"
      OMNISOURCE_PROVIDER_TIMEOUT: "3.0"
      OMNISOURCE_LOG_LEVEL: INFO
      OMNISOURCE_ENVIRONMENT: production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
